<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Anisha 💜</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:#0f0a1a;color:#fff;text-align:center;overflow-x:hidden}.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at top,#3a1a6b,#0f0a1a 70%)}h1{font-family:'Great Vibes',cursive;font-size:65px;color:#e9d5ff}h2{font-size:32px;letter-spacing:2px}.card{background:rgba(255,255,255,.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.15);border-radius:30px;padding:30px 22px;max-width:380px;margin:20px auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}.card p{font-size:16px;line-height:1.8;color:#f3e8ff}.pill{display:inline-block;background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.4);padding:8px 18px;border-radius:100px;margin:6px;font-size:13px}.btn{margin-top:25px;background:linear-gradient(90deg,#a855f7,#ec4899);border:none;padding:14px 32px;border-radius:100px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(168,85,247,.5)}.confetti{position:fixed;width:10px;height:10px;top:-10px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}</style></head><body><div class="hero"><div style="font-size:40px">💜✨</div><h1>Happy Birthday</h1><h2>ANISHA</h2><div class="card"><p>I Found You 🎵<br><br>> a beautiful smile, a pure heart,<br>and a special soul.<br><br>> Sending you lots of care, respect,<br>> and best wishes on your birthday ✨<br><br>> Stay blessed and always happy.</p><div style="margin-top:18px"><span class="pill">💜 Care</span><span class="pill">🤍 Respect</span><span class="pill">✨ Best Wishes</span></div><button class="btn" onclick="celebrate()">Tap for Surprise 🎉</button><p style="margin-top:18px;font-size:12px;opacity:.6">— syed_shafat7</p></div></div><script>function celebrate(){for(let i=0;i<80;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${270+Math.random()*60},100%,70%)`;c.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}alert('Happy Birthday Anisha 💜✨')}setTimeout(celebrate,800)</script></body></html>
